name: daily-sync
on:
  schedule:
    - cron: "0 2 * * *"  # once a day, 02:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kbsync .
      - name: Scrape and upload delta
        env:
          API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VECTOR_STORE_ID: ${{ secrets.VECTOR_STORE_ID }}
        run: |
          mkdir -p logs
          docker run --rm -e API_KEY -e VECTOR_STORE_ID -v "$PWD/logs:/app/logs" kbsync 2>&1 | grep -v "HTTP Request" | tee logs/run.log
          exit ${PIPESTATUS[0]}
      - name: Job summary
        if: always()
        run: |
          if [ -f logs/last_run.json ]; then
            python3 -c "import json; s=json.load(open('logs/last_run.json')); print('| added | updated | skipped | failed | chunks (est.) |\n|---|---|---|---|---|\n| {added} | {updated} | {skipped} | {failed} | {chunks_embedded_est} |'.format(**s))" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: last-run
          path: logs/
          retention-days: 30
